name: varredura diária

on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: nota dos institutos
        run: python -m model.ratings
      - name: varredura TSE + Wikipedia e publicacao
        run: python -m pipeline.coleta
      - name: commit dos dados
        run: |
          git config user.name "agregador-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "dados $(date -u +%F)"
          git push
