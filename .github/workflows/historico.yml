name: histórico (roda uma vez, manual)

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "anos separados por espaco"
        default: "2022 2018"

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.historico ${{ github.event.inputs.anos }}
      - run: python -m model.ratings
      - run: |
          git config user.name "agregador-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "historico institutos"
          git push
